name: Go checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

env:
  http_proxy: ${{ vars.CI_NETWORK_PROXY }}
  https_proxy: ${{ vars.CI_NETWORK_PROXY }}
  # Domestic mirrors are reached directly; large downloads through the CI proxy stall.
  no_proxy: mirrors.aliyun.com,goproxy.cn
  GOPROXY: ${{ vars.GO_MODULE_PROXY || 'https://goproxy.cn,https://proxy.golang.org,direct' }}
  GO_DOWNLOAD_BASE_URL: ${{ vars.GO_DOWNLOAD_BASE_URL || 'https://mirrors.aliyun.com/golang' }}
  # Actions cache has no domestic mirror: give up a stalled restore after 2 minutes
  # instead of the default 10 and continue as a cache miss.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

permissions:
  contents: read

concurrency:
  group: go-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Go changes and workflow validation
    env:
      # Hosted runners cannot reach the isolated runner host's bridge proxy.
      http_proxy: ''
      https_proxy: ''
      GOPROXY: https://proxy.golang.org,direct
      GO_DOWNLOAD_BASE_URL: https://go.dev/dl
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      go: ${{ github.event_name == 'pull_request' && steps.paths.outputs.go == 'true' || github.event_name != 'pull_request' && steps.reuse.outputs.verified != 'true' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3.0.2
        id: paths
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            go:
              - '{driver/**,Makefile,scripts/**,.github/workflows/**}'
              - '!**/*.md'
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0（v6.5.0 的 SHA 归档在 codeload 返回 404，2026-10-15）
        with:
          go-version-file: driver/go.mod
          cache-dependency-path: driver/go.sum
          # Isolated runner images carry the toolchain and caches; the remote cache only stalls there.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: make workflow-check
      # A squash whose tree equals the PR head it came from was already checked there.
      - name: Reuse verified PR head
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          verified() {
            local head main_tree head_tree passed
            head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq "map(select(.merge_commit_sha == \"$SHA\"))[0].head.sha // empty") || return 1
            [[ -n "$head" ]] || { echo "No merged PR for $SHA."; return 1; }
            main_tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || return 1
            head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha) || return 1
            [[ -n "$main_tree" && "$main_tree" == "$head_tree" ]] || { echo "Tree differs from PR head $head."; return 1; }
            passed=$(gh api "repos/$REPO/commits/$head/check-runs?per_page=100" --jq '
              [.check_runs[] | select(.name == "Driver build" or .name == "Driver race" or .name == "Driver vuln")]
              | group_by(.name) | map(max_by(.id)) | map(select(.conclusion == "success")) | length') || return 1
            [[ "$passed" == 3 ]] || { echo "PR head $head lacks successful build, race and vuln."; return 1; }
            echo "::notice::Tree equals PR head $head, which passed Go checks; skipping them."
          }
          if verified; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Running Go checks on main.'
          fi
      - name: Check ticket reference
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -Eq '(^|[^[:alnum:]_])(#[0-9]+|[A-Z][A-Z0-9]*-[0-9]+)([^[:alnum:]_]|$)' <<< "$PR_BODY"; then
            echo '::warning::PR body should reference GH-n, #n, or a Linear ID.'
          fi

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Driver build
    runs-on: ${{ fromJSON(vars.GO_RUNNER_LABELS_JSON || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0（v6.5.0 的 SHA 归档在 codeload 返回 404，2026-10-15）
        with:
          go-version-file: driver/go.mod
          cache-dependency-path: driver/go.sum
          # Isolated runner images carry the toolchain and caches; the remote cache only stalls there.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: make build
      - run: make vet
      - run: make lint

  race:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Driver race
    runs-on: ${{ fromJSON(vars.GO_RUNNER_LABELS_JSON || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0（v6.5.0 的 SHA 归档在 codeload 返回 404，2026-10-15）
        with:
          go-version-file: driver/go.mod
          cache-dependency-path: driver/go.sum
          # Isolated runner images carry the toolchain and caches; the remote cache only stalls there.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: make race
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-reports
          path: |
            .omc/reports/race/tests.json
            .omc/reports/race/junit.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  vuln:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Driver vuln
    runs-on: ${{ fromJSON(vars.GO_RUNNER_LABELS_JSON || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0（v6.5.0 的 SHA 归档在 codeload 返回 404，2026-10-15）
        with:
          go-version-file: driver/go.mod
          cache-dependency-path: driver/go.sum
          # Isolated runner images carry the toolchain and caches; the remote cache only stalls there.
          cache: ${{ runner.environment == 'github-hosted' }}
      - run: make vuln

  gate:
    name: Driver ${{ matrix.check }}
    if: always()
    needs: [changes, build, race, vuln]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # vet/lint remain required by existing branch protection.
        check: [gate, vet, lint]
    steps:
      - name: Check required results
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $NEEDS_RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::Required job result: $result"; exit 1 ;;
            esac
          done
