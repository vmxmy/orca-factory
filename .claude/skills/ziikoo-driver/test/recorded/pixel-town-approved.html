        return `<button class="ticket-chip ${ticket.tone} ${state.selected===ticket.id?'selected':''}" data-ticket="${ticket.id}" data-x="${position.x}" data-y="${position.y+31}" aria-label="查看 ${ticket.id} ${ticket.title}">${ticket.id}${ticket.completed?' ✓':''}</button>`;
      }).join('');
      labels.insertAdjacentHTML('beforeend',[
        [520,126,'工坊流水线','room-sign'],
        [500,329,'↑ 修正后回施工',''],
        [714,329,'验收异常 ↓',''],
        [880,329,'审查退回 ↓',''],
        [274,468,'← 人工接手',''],
        [520,665,'← 合并、部署、出厂检查','']
      ].map(([left,top,text,kind])=>`<span class="world-label route-note ${kind}" data-x="${left}" data-y="${top}">${text}</span>`).join(''));
    }
    positionLabels();
  }
  function toScreen(left,top) {return {x:(left-camera.centerX)*camera.scale+camera.width/2,y:(top-camera.centerY)*camera.scale+camera.height/2};}
  function placeTicketLabel(label,ticket,position) {
    label.hidden=false;
    const point=toScreen(position.x,position.y+31);
    if(camera.width<500){
      if(stages[ticket.stage].branch){point.x+=35;point.y-=29*camera.scale;}
      else{
        const siblings=activeTickets(ticket.project).filter(other=>other.stage===ticket.stage);
        if(siblings.length>1){
          point.x+=(siblings.indexOf(ticket)-(siblings.length-1)/2)*Math.max(0,46-62*camera.scale)*(stages[ticket.stage].y===285?-1:1);
        }
      }
      const half=label.offsetWidth/2+3;
      if(point.x>-half&&point.x<camera.width+half)point.x=Math.max(half,Math.min(camera.width-half,point.x));
    }
    label.style.left=`${point.x}px`;label.style.top=`${point.y}px`;
    label.hidden=point.x+label.offsetWidth/2<0||point.x-label.offsetWidth/2>camera.width||point.y+label.offsetHeight/2<0||point.y-label.offsetHeight/2>camera.height;
  }
  function positionLabels() {
    labels.querySelectorAll('[data-x]').forEach(label=>{
      if(label.dataset.ticket){const ticket=ticketOf(label.dataset.ticket);placeTicketLabel(label,ticket,ticketPosition(ticket));}
      else{
        label.hidden=false;
        const point=toScreen(Number(label.dataset.x),Number(label.dataset.y));
        label.style.left=`${point.x}px`;label.style.top=`${point.y}px`;
        const halfWidth=label.offsetWidth/2,halfHeight=label.offsetHeight/2;
        label.hidden=state.view==='project'
          ?point.x+halfWidth<0||point.x-halfWidth>camera.width||point.y+halfHeight<0||point.y-halfHeight>camera.height
          :point.x-halfWidth<4||point.x+halfWidth>camera.width-4||point.y-halfHeight<130||point.y+halfHeight>camera.height-85;
      }
    });
  }
  function constrainCamera() {
    const bounds=state.view==='project'?{width:1040,height:760}:townLayout.bounds;
    const halfWidth=camera.width/(2*camera.scale),halfHeight=camera.height/(2*camera.scale);
    const following=state.view==='project'&&state.selected&&matchMedia('(max-width:760px)').matches;
    if(following){
      camera.centerX=Math.max(0,Math.min(bounds.width,camera.centerX));
      camera.centerY=Math.max(0,Math.min(bounds.height+Math.max(0,(camera.height/2-175)/camera.scale),camera.centerY));
    }else{
      camera.centerX=halfWidth*2>=bounds.width?bounds.width/2:Math.max(halfWidth,Math.min(bounds.width-halfWidth,camera.centerX));
      camera.centerY=halfHeight*2>=bounds.height?bounds.height/2:Math.max(halfHeight,Math.min(bounds.height-halfHeight,camera.centerY));
    }
    state.panX=(520-camera.centerX)*camera.scale;state.panY=(400-camera.centerY)*camera.scale;
  }
  function sizeCanvas(reset=false) {
    const bounds=viewport.getBoundingClientRect();camera.width=bounds.width;camera.height=bounds.height;
    const bitmapWidth=Math.ceil(bounds.width/2),bitmapHeight=Math.ceil(bounds.height/2);
    if(canvas.width!==bitmapWidth)canvas.width=bitmapWidth;
    if(canvas.height!==bitmapHeight)canvas.height=bitmapHeight;
    context.imageSmoothingEnabled=false;
    const mobile=bounds.width<500;
    const fitted=state.view==='project'?Math.min(bounds.width/(mobile?930:1040),bounds.height/820):Math.max(.65,Math.min(bounds.width/1040,bounds.height/820));
    const centerX=camera.centerX,centerY=camera.centerY,previousScale=camera.scale;
    if(state.view!=='project')state.zoom=Math.max(state.zoom,.65/fitted);
    camera.scale=fitted*state.zoom;
    if(reset){state.panX=0;state.panY=0;}
    else if(state.view!=='project'&&previousScale!==camera.scale){state.panX=(520-centerX)*camera.scale;state.panY=(400-centerY)*camera.scale;}
    camera.centerX=520-state.panX/camera.scale;camera.centerY=400-state.panY/camera.scale;
    constrainCamera();
    document.querySelector('#zoom-text').textContent=`${Math.round(state.zoom*100)}%`;
    if(state.view!=='project'){
      const halfWidth=camera.width/(2*camera.scale),halfHeight=camera.height/(2*camera.scale);
      townLayout.visible=townLayout.anchors.filter(anchor=>Math.abs(anchor.x-camera.centerX)<halfWidth+190&&anchor.y+160>camera.centerY-halfHeight&&anchor.y-150<camera.centerY+halfHeight);
      townBase.width=canvas.width;townBase.height=canvas.height;townDirty=true;createLabels();
    }else positionLabels();
    needsDraw=true;
  }
  function focusTownProject() {
    const anchor=townLayout.anchors.find(item=>item.project.id===state.project);
    if(!anchor)return;
    const left=camera.width<700?anchor.x:520;
    state.panX=(520-left)*camera.scale;state.panY=(400-anchor.y-40)*camera.scale;
    sizeCanvas();
  }
  function updateURL() {
    const current=new URLSearchParams(location.search);
    current.set('count',projects.length);current.set('view',state.view);
    if(state.project)current.set('project',state.project);else current.delete('project');
    if(state.selected)current.set('ticket',state.selected);else current.delete('ticket');
    try{history.replaceState(null,'',`${location.pathname}?${current}`);}catch{}
  }
  function applyProjectCount() {
    const input=document.querySelector('#project-count'),error=document.querySelector('#project-count-error'),count=parseProjectCount(input.value);
    input.setAttribute('aria-invalid',String(count===null));error.hidden=count!==null;
    if(count===null){error.textContent='请输入 0 到 1000 之间的整数，当前项目保持不变。';return;}
    input.value=count;
    if(count===projects.length)return;
    const previousAnchor=townLayout.anchors.find(anchor=>anchor.project.id===state.project);
    const previousIds=new Set(projects.map(project=>project.id));
    projects=demoProjects(count);
    const ids=new Set(projects.map(project=>project.id));
    tickets=tickets.filter(ticket=>ids.has(ticket.project));
    tickets.push(...ticketSeeds.filter(ticket=>ids.has(ticket.project)&&!previousIds.has(ticket.project)).map(ticket=>({...ticket,history:ticket.history.map(entry=>[...entry])})));
    for(const id of moves.keys())if(!ticketOf(id))moves.delete(id);
    const removedProject=!ids.has(state.project);
    if(removedProject){state.project=projects[0]?.id||null;state.station=null;state.zoom=1;}
    if(!ticketOf(state.selected))state.selected=null;
    if(!projects.length){state.view='town';state.station=null;}
    townLayout=deriveTownLayout(projects);
    const nextAnchor=townLayout.anchors.find(anchor=>anchor.project.id===state.project);
    const anchorMoved=previousAnchor&&nextAnchor&&(previousAnchor.x!==nextAnchor.x||previousAnchor.y!==nextAnchor.y);
    clearSearch();updateSidebar();updateHeader();updateDetail();rebuildGround();createLabels();sizeCanvas(removedProject);
    if(state.view!=='project'&&(removedProject||anchorMoved))focusTownProject();
    updateURL();
  }
  function setView(view,project) {
    const returning=state.view==='project'&&view!=='project';
    state.project=projectOf(project)?.id||projectOf(state.project)?.id||projects[0]?.id||null;
    state.view=view==='project'&&!state.project?'town':view;
    state.selected=null;state.station=null;state.zoom=1;state.panX=0;state.panY=0;
    updateSidebar();updateHeader();updateDetail();rebuildGround();sizeCanvas(true);createLabels();
    if(state.view!=='project'&&(returning||camera.width<700))focusTownProject();
    updateURL();
  }
  function selectTicket(id) {
    const ticket=ticketOf(id);if(!ticket)return;
    if(state.view!=='project'||state.project!==ticket.project)setView('project',ticket.project);
    state.selected=id;state.station=null;updateDetail();createLabels();needsDraw=true;
    document.querySelector('#detail-panel').scrollTop=0;
    if(matchMedia('(max-width:760px)').matches){
      state.zoom=1.65;sizeCanvas();
      const position=ticketPosition(ticket);
      state.panX=(520-position.x)*camera.scale;
      state.panY=(400-position.y)*camera.scale+175-camera.height/2;
      sizeCanvas();
    }
    updateURL();
  }
  function showToast(message) {
    const toast=document.querySelector('#toast');toast.textContent=message;toast.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('visible'),2300);
  }
  async function copyText(text) {
    try {
      if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
      else {const textarea=document.createElement('textarea');textarea.value=text;textarea.style.cssText='position:fixed;left:-9999px';document.body.append(textarea);textarea.select();const copied=document.execCommand('copy');textarea.remove();if(!copied)throw new Error('clipboard');}
      showToast('已复制到剪贴板');
    }catch{showToast('浏览器限制了复制，请手动选择详情中的文字。');}
  }
  function movementPath(fromStage,next,from,to) {
    if(fromStage==='review'&&next==='pack')return [from,{x:948,y:285},{x:948,y:610},to];
    if(fromStage==='review'&&next==='return')return [from,{x:880,y:442},to];
    if(fromStage==='repair'&&next==='work')return [from,{x:400,y:442},to];
    return [from,to];
  }
  function pointAlong(points,amount) {
    const lengths=points.slice(1).map((point,index)=>Math.hypot(point.x-points[index].x,point.y-points[index].y));
    let remaining=lengths.reduce((sum,length)=>sum+length,0)*amount;
    for(let index=0;index<lengths.length;index++){
      if(remaining<=lengths[index]){
        const fraction=lengths[index]?remaining/lengths[index]:1;
        return {x:points[index].x+(points[index+1].x-points[index].x)*fraction,y:points[index].y+(points[index+1].y-points[index].y)*fraction};
      }
      remaining-=lengths[index];
    }
    return points[points.length-1];
  }
  function advance(branch) {
    const ticket=ticketOf('OF-127');
    if(moves.has(ticket.id)||ticket.completed)return;
    const previous=ticket.stage,from=ticketPosition(ticket);
    let next=mainRoute[mainRoute.indexOf(previous)+1];
    if(branch==='exception'&&previous==='gate')next='repair';
    else if(branch==='exception'&&previous==='review')next='return';
    else if(branch==='human'&&previous==='repair')next='human';
    else if(previous==='human')next='return';
    else if(previous==='repair'||previous==='return')next='work';
    else if(previous==='smoke'){next='smoke';ticket.completed=true;}
    ticket.stage=next;ticket.minutes=0;ticket.owner=next==='merge'?'合并队列':'执行器';ticket.queue=next==='merge'?1:undefined;
    ticket.tone=stages[next].branch?'attention':'current';
    ticket.reason=next==='repair'?'演示：验收未通过，包裹已转入修理支线。':next==='return'?'演示：任务需要修改，确认后回到制作台。':next==='human'?'演示：自动处置未能解决问题，等待人工确认。':undefined;
    if(next==='human')ticket.owner='人工';
    moves.set(ticket.id,{points:movementPath(previous,next,from,ticketPosition(ticket)),start:performance.now()});
    const [lastHour,lastMinute]=ticket.history[0][0].split(':').map(Number),nextMinute=(lastHour*60+lastMinute+1)%(24*60);
    const demoTime=`${String(Math.floor(nextMinute/60)).padStart(2,'0')}:${String(nextMinute%60).padStart(2,'0')}`;
    ticket.history.unshift([demoTime,ticket.completed?'演示：出厂检查通过，任务完成':`演示：进入${stages[next].name}`]);
    if(ticket.history.length>5)ticket.history.pop();
    updateDetail();updateSidebar();updateHeader();createLabels();rebuildGround();
  }
  function runSearch() {
    const query=document.querySelector('#search').value.trim().toLowerCase();state.query=query;
    const resultBox=document.querySelector('#search-results');resultBox.hidden=!query;
    if(!query){resultBox.innerHTML='';needsDraw=true;return;}
    const matched=tickets.filter(ticket=>`${ticket.id} ${ticket.title} ${projectOf(ticket.project).name}`.toLowerCase().includes(query));
    const matchedProjects=projects.filter(project=>project.name.toLowerCase().includes(query));
    resultBox.innerHTML=matchedProjects.map(project=>`<button class="search-result" data-project="${project.id}"><strong>${project.name}</strong><small>进入工坊内部</small></button>`).join('')+matched.map(ticket=>`<button class="search-result" data-ticket="${ticket.id}"><strong>${ticket.id} · ${escapeText(ticket.title)}</strong><small>${projectOf(ticket.project).name} · ${ticket.completed?'已完成':stages[ticket.stage].phase}</small></button>`).join('')||'<div class="empty-state">没有找到匹配的委托或项目。</div>';
    needsDraw=true;
  }
  function clearSearch(){document.querySelector('#search').value='';state.query='';document.querySelector('#search-results').hidden=true;document.querySelector('#search-results').innerHTML='';}
  function drawDynamic(time) {
    drawContext=context;
    if(state.view!=='project'){
      for(const {project,x,y} of townLayout.visible){
        const list=activeTickets(project.id);
        if(list.length){
          const walk=state.reduced?0:Math.sin(time*.33+x)*38;
          person(x+walk,y+45,time,'#77959b',!state.reduced,x);
          person(x-79,y+37,time,'#a69569',false);
          crate(x+walk+11,y+47,true);
          const puff=state.reduced?0:(time*8)%31;
          rect(x+40,y-112-puff,8,6,'#e3e6cd99');rect(x+44,y-120-puff,12,8,'#e8e9d388');
        }
        if(list.some(ticket=>ticket.tone!=='current')){
          const left=x+104,top=y-59;
          rect(left,top,3,38,'#8d7450');rect(left+3,top,22,13,'#c69b4f');rect(left+11,top+3,2,5,'#f8edc5');rect(left+11,top+10,2,2,'#f8edc5');
        }
      }
      const random=seeded(30);
      for(let butterfly=0;butterfly<5;butterfly++){const left=100+random()*850,top=180+random()*480,flutter=state.reduced?0:Math.sin(time*2+butterfly)*8;rect(left+flutter,top,3,3,'#edda9b');rect(left+5+flutter,top+1,3,2,'#f0e7bb');}
    }else{
      beltRollers(mainBelt,38,state.reduced?0:(time*17)%17);
      for(const left of [280,520,760]){arrow(left,285,0);arrow(left,610,Math.PI);}
      arrow(948,391,Math.PI/2);arrow(948,506,Math.PI/2);
      for(const [id,station] of Object.entries(stages))workbench(id,station,time);
      for(const ticket of activeTickets(state.project)){
        let position=ticketPosition(ticket),movement=moves.get(ticket.id);
        if(movement){
          const amount=state.reduced?1:Math.min(1,(performance.now()-movement.start)/1200);
          position=pointAlong(movement.points,amount);
          if(amount===1){
            moves.delete(ticket.id);
            if(state.selected===ticket.id)updateDetail();
            showToast(ticket.completed?'演示：出厂检查通过，任务已完成':`演示：${ticket.id} 已到${stages[ticket.stage].name}`);
            needsDraw=true;
          }
        }
        const label=labels.querySelector(`[data-ticket="${ticket.id}"]`);
        if(label)placeTicketLabel(label,ticket,position);
        if(state.selected===ticket.id){
          drawContext.strokeStyle=ticket.tone==='current'?'#507d8e':'#b98940';drawContext.lineWidth=2;drawContext.setLineDash([4,4]);drawContext.strokeRect(Math.round(position.x-19),Math.round(position.y-13),39,29);drawContext.setLineDash([]);
        }
        crate(position.x-9,position.y-9);
        rect(position.x-4,position.y-6,8,6,'#f0ddb1');rect(position.x-2,position.y-5,4,1,ticket.tone==='current'?'#6e8d94':'#b08746');
        if(ticket.tone!=='current'){rect(position.x+17,position.y-27,2,23,'#8b754a');rect(position.x+19,position.y-27,13,10,ticket.tone==='failed'?'#b46e54':'#c69b4f');rect(position.x+23,position.y-25,2,4,'#f7e7bb');}
        if(ticket.completed){rect(position.x+17,position.y-27,2,23,'#8b754a');rect(position.x+19,position.y-27,13,10,'#6f9260');}
        if(ticket.queue){drawContext.fillStyle='#66593d';drawContext.font='9px monospace';drawContext.textAlign='center';drawContext.fillText(String(ticket.queue),position.x,position.y-14);}
      }
    }
  }
  function frame(timestamp) {
    requestAnimationFrame(frame);
    if(document.hidden||timestamp-lastFrame<40||state.reduced&&!needsDraw&&!moves.size)return;
    lastFrame=timestamp;needsDraw=false;
    const selectedMove=moves.get(state.selected);
    if(selectedMove&&state.view==='project'&&matchMedia('(max-width:760px)').matches){
      const position=pointAlong(selectedMove.points,state.reduced?1:Math.min(1,(timestamp-selectedMove.start)/1200));
      state.panX=(520-position.x)*camera.scale;
      state.panY=(400-position.y)*camera.scale+175-camera.height/2;
      camera.centerX=520-state.panX/camera.scale;camera.centerY=400-state.panY/camera.scale;
      positionLabels();
    }
    context.setTransform(1,0,0,1,0,0);context.clearRect(0,0,canvas.width,canvas.height);context.fillStyle=state.view==='project'?'#d4c5a3':palette.grass;context.fillRect(0,0,canvas.width,canvas.height);
    if(state.view!=='project'){
      if(townDirty){
        townGround.setTransform(1,0,0,1,0,0);townGround.fillStyle=palette.grass;townGround.fillRect(0,0,townBase.width,townBase.height);
        townGround.setTransform(camera.scale/2,0,0,camera.scale/2,(camera.width/2-camera.centerX*camera.scale)/2,(camera.height/2-camera.centerY*camera.scale)/2);
        drawContext=townGround;drawTown();townDirty=false;
      }
      context.drawImage(townBase,0,0);
    }
    context.save();context.scale(.5,.5);context.translate(camera.width/2,camera.height/2);context.scale(camera.scale,camera.scale);context.translate(-camera.centerX,-camera.centerY);
    if(state.view==='project')context.drawImage(base,0,0);
    drawDynamic(timestamp/1000);context.restore();
  }
  document.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.dataset.project){setView('project',target.dataset.project);clearSearch();}
    else if(target.dataset.ticket){selectTicket(target.dataset.ticket);clearSearch();}
    else if(target.dataset.view)setView(target.dataset.view);
    else if(target.dataset.station){state.station=target.dataset.station;state.selected=null;updateDetail();createLabels();updateURL();needsDraw=true;}
    else if(target.hasAttribute('data-close')){state.selected=null;state.station=null;updateDetail();createLabels();updateURL();needsDraw=true;}
    else if(target.dataset.copy){
      const ticket=ticketOf(state.selected);if(!ticket)return;
      copyText(target.dataset.copy==='id'?ticket.id:`${ticket.id} · ${ticket.title}\n项目：${projectOf(ticket.project).name}\n阶段：${stages[ticket.stage].phase}\n已观察：${ticket.minutes} 分钟${ticket.reason?`\n原因：${ticket.reason}`:''}\n（设计原型演示数据）`);
    }else if(target.id==='advance')advance();
    else if(target.id==='demo-exception')advance('exception');
    else if(target.id==='demo-human')advance('human');
  });
  document.querySelector('#brand').addEventListener('click',()=>setView('town'));
  document.querySelector('#project-count').addEventListener('change',applyProjectCount);
  document.querySelector('#project-count').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();applyProjectCount();}});
  document.querySelector('#search').addEventListener('input',runSearch);
  document.querySelector('#search').addEventListener('keydown',event=>{if(event.key==='Enter'){const first=document.querySelector('#search-results button');if(first){first.click();event.preventDefault();}}if(event.key==='Escape')clearSearch();});
  document.addEventListener('pointerdown',event=>{if(!event.target.closest('.search-wrap'))document.querySelector('#search-results').hidden=true;});
  document.querySelector('#search').addEventListener('focus',()=>{if(state.query)runSearch();});
  document.querySelector('#motion-toggle').addEventListener('click',()=>{state.reduced=!state.reduced;updateHeader();needsDraw=true;});
  function zoom(amount){state.zoom=Math.max(.7,Math.min(2.4,state.zoom+amount));sizeCanvas();}
  document.querySelector('#zoom-in').addEventListener('click',()=>zoom(.2));
  document.querySelector('#zoom-out').addEventListener('click',()=>zoom(-.2));
  document.querySelector('#fit-map').addEventListener('click',()=>{state.zoom=1;sizeCanvas(true);if(state.view!=='project')focusTownProject();});
  canvas.addEventListener('wheel',event=>{event.preventDefault();zoom(event.deltaY>0?-.08:.08);},{passive:false});
  canvas.addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY,panX:state.panX,panY:state.panY};canvas.setPointerCapture(event.pointerId);});
  canvas.addEventListener('pointermove',event=>{if(!drag)return;state.panX=drag.panX+event.clientX-drag.x;state.panY=drag.panY+event.clientY-drag.y;sizeCanvas();});
  canvas.addEventListener('pointerup',()=>{drag=null;});canvas.addEventListener('pointercancel',()=>{drag=null;});
  document.addEventListener('keydown',event=>{
    if(event.target.matches('input,textarea,[contenteditable]'))return;
    if(event.key==='/'){event.preventDefault();document.querySelector('#search').focus();}
    if(event.key==='Escape'){if(state.selected||state.station){state.selected=null;state.station=null;updateDetail();createLabels();updateURL();needsDraw=true;}else if(state.view!=='town')setView('town');}
  });
  new ResizeObserver(()=>sizeCanvas()).observe(viewport);
  const initialView=parameters.get('view'),initialProject=parameters.get('project');
  document.querySelector('#project-count').value=projects.length;
  if(projectOf(initialProject))state.project=initialProject;
  setView(['town','project','attention'].includes(initialView)?initialView:'town',state.project);
  if(state.view!=='project'&&projectOf(initialProject))focusTownProject();
  if(ticketOf(parameters.get('ticket')))selectTicket(parameters.get('ticket'));
  requestAnimationFrame(frame);
})();
</script>
